nc: 1 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=train-yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs


# MSG-YOLO
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, MSGhostConv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_Star, [256, False, 0.25]]
  - [-1, 1, MSGhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_Star, [512, False, 0.25]]
  - [-1, 1, MSGhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_Star, [512, True]]
  - [-1, 1, MSGhostConv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_Star, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# MSG-YOLO head
head:
  - [-1, 1, DySample, [2, 'lp', 4]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_Star, [512, True]] # 13

  - [-1, 1, DySample, [2, 'lp', 4]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_Star, [256, True]] # 16 (P3/8-small)

  - [-1, 1, MSGhostConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_Star, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, MSGhostConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2_Star, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, CoupledDetect, [nc, 1, True]] # Detect(P3, P4, P5)
